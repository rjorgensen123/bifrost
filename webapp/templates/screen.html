<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ screen.name }}</title>
  <style nonce="{{ csp_nonce }}">
    html,body{margin:0;height:100%;background:#0d132d;overflow:hidden;
              font-family:system-ui,-apple-system,sans-serif}
    #stage{position:relative;width:100vw;height:100vh}
    .slide{position:absolute;inset:0;border:0;width:100%;height:100%;
           opacity:0;transition:opacity .4s ease;pointer-events:none}
    .slide.on{opacity:1}
    #cap{position:absolute;left:0;right:0;bottom:0;margin:0;padding:12px 18px;
         background:rgba(0,0,0,.5);color:#fff;font:600 22px/1.3 system-ui;z-index:10}
    #empty{display:flex;align-items:center;justify-content:center;height:100vh;
           color:#9fb3d9;font:600 18px system-ui}
  </style>
</head>
<body>
{% if slides %}
  <div id="stage">
    {% for s in slides %}
    <iframe class="slide" scrolling="no"></iframe>
    {% endfor %}
  </div>
  <div id="cap" hidden></div>
  <script nonce="{{ csp_nonce }}">
  (function () {
    var slides = [
      {% for s in slides %}
      { url: {{ url_for('infoscreen.slide_view', token=screen.token, pos=loop.index0)|tojson }},
        dur: {{ [2, s.duration_sec]|max }}, cap: {{ (s.caption or '')|tojson }} }{{ ',' if not loop.last }}
      {% endfor %}
    ];
    var frames = [].slice.call(document.querySelectorAll('.slide'));
    var cap = document.getElementById('cap');
    var i = -1, timer = null;
    function show(n) {
      i = ((n % slides.length) + slides.length) % slides.length;
      var s = slides[i];
      // Reload den aktive for ferske data (auto-refresh hver runde).
      frames[i].src = s.url + (s.url.indexOf('?') < 0 ? '?' : '&') + 't=' + (new Date()).getTime();
      frames.forEach(function (f, k) { f.classList.toggle('on', k === i); });
      if (s.cap) { cap.textContent = s.cap; cap.hidden = false; } else { cap.hidden = true; }
      clearTimeout(timer);
      timer = setTimeout(function () { show(i + 1); }, s.dur * 1000);
    }
    show(0);
    // 1.8.3 (G-290): trykk/klikk HVOR SOM HELST → hopp til neste slide (timeren restarter i show()).
    // Slides er pointer-events:none (BEVISST — innholdet er ren visning, G-290), så body får trykket.
    document.addEventListener('click', function () { show(i + 1); });
  })();
  </script>
{% else %}
  <div id="empty">{{ t('screens.kiosk_empty') }}</div>
{% endif %}
</body>
</html>
