<tr class="confirm-del">
  <td colspan="6">
    <span class="hint">{{ t('iface.hide_confirm_named', name=i.if_name) if i.if_name else t('iface.hide_confirm') }}</span>
    <span class="row bf-d-inline-flex bf-gap-6px bf-ml-10px">
      <button type="button" hx-get="{{ url_for('iface_row', iface_id=i.id) }}"
              hx-target="closest tr" hx-swap="outerHTML">{{ t('common.cancel') }}</button>
      <button class="ghost sm danger" hx-post="{{ url_for('delete_interface', iface_id=i.id) }}"
              hx-target="closest .iface-wrap" hx-swap="innerHTML">{{ t('hosts.hide_yes') }}</button>
    </span>
  </td>
</tr>
