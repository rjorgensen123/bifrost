# Bifrost. © Roger Jorgensen (rogerj@gmail.com). Last modified: v1.5.4
# Bifrost CI (Gitea Actions) — in-house, ingen markedsplass-actions / ingen github.com.
# SPDX-License-Identifier: AGPL-3.0-or-later
# Scope A+B: statiske sjekker (syntaks) + enhetstester/invarianter. Bygger/booter IKKE stacken (Tier C
# er bevisst utsatt). Kjører på repo-scoped act_runner (label ubuntu-latest). Spec: spec-ci-gitea-*.md i
# prosjektroten.
name: CI

on:
  push:
    branches: [review, main]
  pull_request:
    branches: [review, main]

jobs:
  python:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: Klon repo (manuelt — ingen markedsplass-action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          # Verten tas fra GITHUB_SERVER_URL (Gitea setter den til instansens egen URL) — ikke
          # hardkodet, så CI følger repoet dit det ligger. TLS verifiseres (ingen sslVerify=false).
          HOST="${GITHUB_SERVER_URL#*://}"
          git clone "https://x-access-token:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" src
          cd src && git checkout "${GITHUB_SHA}"
      - name: Installer avhengigheter
        run: |
          set -eu
          cd src
          pip install --no-cache-dir -r webapp/requirements.txt
      - name: Python-syntakssjekk (compileall)
        run: |
          set -eu
          cd src
          python -m compileall webapp poller
      - name: Enhetstester + invarianter (unittest)
        run: |
          set -eu
          cd src/webapp
          python -m unittest discover -s tests -v

  js:
    runs-on: ubuntu-latest
    container: node:20-slim
    steps:
      - name: Klon repo (manuelt — ingen markedsplass-action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          # Verten tas fra GITHUB_SERVER_URL (Gitea setter den til instansens egen URL) — ikke
          # hardkodet, så CI følger repoet dit det ligger. TLS verifiseres (ingen sslVerify=false).
          HOST="${GITHUB_SERVER_URL#*://}"
          git clone "https://x-access-token:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" src
          cd src && git checkout "${GITHUB_SHA}"
      - name: JS-syntakssjekk (node --check)
        run: |
          set -eu
          cd src
          for f in webapp/static/*.js; do echo "check $f"; node --check "$f"; done
